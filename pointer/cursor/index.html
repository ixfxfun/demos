<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cursor</title>
</head>

<body>
  <script type="importmap">{ "imports": { "@ixfx":"/ixfx/core.js", "@ixfx/": "/ixfx/" } }</script>
  <style>
*,
*:before,
*:after,
html,
body {
  box-sizing: border-box;
}

html,body {
  cursor: none;
}

:root {
  color-scheme: light dark;
  --hue: 30;
  --font: system-ui;
  --light: hsl(var(--hue), 10%, 80%);
  --mid: hsl(var(--hue), 10%, 60%);
  --dark: hsl(var(--hue), 80%, 10%);
  --accent: light-dark(hsl(var(--hue), 100%, 40%),hsl(var(--hue), 100%, 80%) )
}

body {
  background-color: light-dark(var(--light), var(--dark));
  color: light-dark(var(--dark), var(--light));
  font-family: var(--font);
  cursor: none;
}

a:link,a:visited {
  color: light-dark(var(--dark), var(--light));
  text-decoration-style: wavy;
}
a:hover {
  color: var(--accent);
}
#cursor {
  width: 100px;
  height: 100px;
  background-color: var(--light);
  border-radius: 50%;
  position: absolute;
  box-shadow: 10px 10px 50px hsl(var(--hue) 80% 2% / .40);
}
  </style>
  <div id="cursor"></div>
  <script type="module" src="script.js"></script>
</body>

</html>
